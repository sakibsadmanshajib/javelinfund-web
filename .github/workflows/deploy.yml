name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run build
        env:
          PUBLIC_FORMS_ENDPOINT: ${{ secrets.PUBLIC_FORMS_ENDPOINT }}

      # Site worker (javelinfund-web): root wrangler.toml serving the built Astro site.
      - name: Deploy Astro site to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # Receipts API worker (javelinfund-decap-oauth): SEPARATE worker with its own
      # wrangler.toml + deps under decap-oauth-worker/. Not covered by the root deploy,
      # so it gets its own install + deploy. Secrets are managed out-of-band via
      # `wrangler secret put` and are NOT touched here.
      - name: Install receipts worker deps
        run: npm ci
        working-directory: decap-oauth-worker

      - name: Deploy receipts API worker to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: decap-oauth-worker
          command: deploy
